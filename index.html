<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PathCal | GPX面積計算</title>
<link rel="icon" type="image/png" href="pathcal.png">
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<style>
  :root {
    color-scheme: light;
  }

  body {
    font-family: system-ui, "Yu Gothic", sans-serif;
    margin: 0;
    background: #f5f7f5;
    color: #203126;
  }

  main {
    max-width: 560px;
    margin: 55px auto;
    padding: 24px;
  }

  h1 {
    font-size: 2.3rem;
    margin-bottom: 4px;
  }

  .sub {
    color: #607165;
    margin-top: 0;
  }

  .panel {
    background: white;
    border: 1px solid #d8e3da;
    border-radius: 14px;
    padding: 24px;
    margin-top: 24px;
  }

  input {
    display: block;
    width: 100%;
    max-width: 100%;
    box-sizing: border-box;
    margin: 14px 0;
    font-size: 1rem;
  }

  .result {
    margin-top: 20px;
  }

  .area {
    font-size: 2rem;
    font-weight: 750;
    margin: 10px 0;
  }

  .other {
    font-size: 1.2rem;
    line-height: 1.9;
  }

  .error {
    color: #a02020;
  }

  .note {
    font-size: .9rem;
    color: #647268;
    line-height: 1.7;
  }

  #map {
    width: 100%;
    height: 420px;
    border: 1px solid #d8e3da;
    border-radius: 10px;
  }

  .map-note {
    font-size: .85rem;
    color: #647268;
    margin-top: 10px;
  }
  .area-red {
    color: #d32f2f;
    font-weight: bold;
  }

  .input-green {
    color: #228b22;
    font-weight: bold;
  }
</style>

</head>
<body>
<main>
  <h1>PathCal</h1>
  <p class="sub">GPX Area Calculator</p>
  <section class="panel">
    <label for="file"><strong>GPXファイルを選択</strong></label>
    <input id="file" type="file" accept=".gpx,application/gpx+xml,application/xml,text/xml" multiple>
    <div id="output" aria-live="polite">ファイルを選択すると面積を表示します。</div>
  </section>
  
  <section class="panel">
    <h2>草刈り場所</h2>
    <div id="map"></div>
    <p class="map-note">
      背景：国土地理院 全国最新写真（シームレス）
    </p>
  </section>
  <section class="panel">
    <h2>料金算定</h2>
    

    <label for="unitPrice" class="input-green">単価を入力してください（円/㎡）</label>
    <input id="unitPrice" type="number"
           min="0" step="any" placeholder="単価（円/㎡）">
    <p id="feeFormula" class="area">料金 ＝ 合計面積 × 単価</p>
    <p id="feeResult" class="area input-green">料金は — 円です</p>

    <p>本日は草刈屋をご利用いただきありがとうございました。</p>
  </section>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
'use strict';

const fileInput = document.getElementById('file');
const output = document.getElementById('output');
document.getElementById('unitPrice').addEventListener('input', () => {
  const areas = Array.from(
    document.querySelectorAll('[data-area]')
  ).map(item => Number(item.dataset.area));

  const total = areas.reduce((sum, area) => sum + area, 0);
  updateFee(total);
});
const format = n => n.toLocaleString('ja-JP', {
  maximumFractionDigits: 2
});

const R = 6371008.8;

// 多角形の面積
function polygonArea(points) {
  if (points.length < 3) return 0;

  const lat0 = points.reduce((sum, p) => sum + p.lat, 0)
    / points.length * Math.PI / 180;
  const lon0 = points[0].lon;
  const latitude0 = points[0].lat;

  const xy = points.map(p => ({
    x: R * (p.lon - lon0) * Math.PI / 180 * Math.cos(lat0),
    y: R * (p.lat - latitude0) * Math.PI / 180
  }));

  let twiceArea = 0;

  for (let i = 0; i < xy.length; i++) {
    const a = xy[i];
    const b = xy[(i + 1) % xy.length];
    twiceArea += a.x * b.y - b.x * a.y;
  }

  return Math.abs(twiceArea) / 2;
}

// 軌跡の長さ（メートル）
function pathLength(points) {
  let length = 0;

  for (let i = 1; i < points.length; i++) {
    const a = points[i - 1];
    const b = points[i];

    const lat1 = a.lat * Math.PI / 180;
    const lat2 = b.lat * Math.PI / 180;
    const dLat = lat2 - lat1;
    const dLon = (b.lon - a.lon) * Math.PI / 180;

    const h = Math.sin(dLat / 2) ** 2
      + Math.cos(lat1) * Math.cos(lat2)
      * Math.sin(dLon / 2) ** 2;

    length += 2 * R * Math.asin(Math.sqrt(Math.min(1, h)));
  }

  return length;
}

// GPXから座標を取り出す
function getPoints(xml) {
  const tracks = Array.from(xml.getElementsByTagNameNS('*', 'trk'));
  const segments = tracks.flatMap(trk =>
    Array.from(trk.getElementsByTagNameNS('*', 'trkseg'))
  );
  const routes = Array.from(xml.getElementsByTagNameNS('*', 'rte'));

  let nodes;

  if (segments.length === 1) {
    nodes = Array.from(segments[0].getElementsByTagNameNS('*', 'trkpt'));
  } else if (segments.length > 1) {
    throw new Error('複数の軌跡区間があります。');
  } else if (routes.length === 1) {
    nodes = Array.from(routes[0].getElementsByTagNameNS('*', 'rtept'));
  } else {
    throw new Error('軌跡が見つかりません。');
  }

  const points = nodes.map(node => ({
    lat: Number(node.getAttribute('lat')),
    lon: Number(node.getAttribute('lon'))
  }));

  if (points.length < 2 || points.some(p =>
    !Number.isFinite(p.lat) ||
    !Number.isFinite(p.lon) ||
    Math.abs(p.lat) > 90 ||
    Math.abs(p.lon) > 180
  )) {
    throw new Error('有効な座標が2点以上必要です。');
  }

  return points;
}

// 面積の単位表示
function areaText(area) {
  return `<span class="area-red">${format(area)} ㎡</span> ／ `
    + `${format(area / 991.7355)} 反 ／ `
    + `${format(area / 99.17355)} 畝 ／ `
    + `${format(area / 100)} a ／ `
    + `${format(area / 10000)} ha`;
}
// 料金算定
function updateFee(total) {
  const input = document.getElementById('unitPrice');
  const result = document.getElementById('feeResult');
  const formula = document.getElementById('feeFormula');

  const price = Number(input.value);

  if (input.value.trim() === '' ||
      !Number.isFinite(price) || price < 0) {
    formula.textContent =
      `料金 ＝ 合計面積（${format(total)}㎡）× —`;
    result.textContent = '料金は — 円です。';
    return;
  }

  formula.textContent =
    `料金 ＝ 合計面積（${format(total)}㎡）× ${format(price)}`;

  const fee = Math.round(total * price);
  result.textContent =
    `料金は ${fee.toLocaleString('ja-JP')} 円です。`;
}
// 合計面積の更新

function updateTotal() {
  const areas = Array.from(
    document.querySelectorAll('[data-area]')
  ).map(item => Number(item.dataset.area));

  const total = areas.reduce((sum, area) => sum + area, 0);

  const formula = areas.map(area =>
    `${format(area)}㎡`
  ).join(' ＋ ');

  document.getElementById('total').textContent =
    `${formula} ＝ ${format(total)}㎡`;

  document.getElementById('totalUnits').textContent =
    `${format(total / 991.7355)}反 ／ ` +
    `${format(total / 99.17355)}畝 ／ ` +
    `${format(total / 100)}a ／ ` +
    `${format(total / 10000)}ha`;

    updateFee(total);  
}


// 国土地理院の空中写真
const map = L.map('map').setView([35, 135], 5);

L.tileLayer(
  'https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg',
  {
    attribution: '地理院タイル',
    maxZoom: 18,
    maxNativeZoom: 18
  }
).addTo(map);

// GPX軌跡をまとめるレイヤー
const trackLayer = L.featureGroup().addTo(map);

// GPX軌跡の描画
function drawTrack(points, area) {
  const coordinates = points.map(p => [p.lat, p.lon]);

  if (area > 0) {
    // 面積モード：赤線と半透明の塗りつぶし
    L.polygon(coordinates, {
      color: '#e53935',
      weight: 3,
      fillColor: '#e53935',
      fillOpacity: 0.2
    }).addTo(trackLayer);
  } else {
    // 線モード：青線
    L.polyline(coordinates, {
      color: '#1565c0',
      weight: 4
    }).addTo(trackLayer);
  }
}

// GPX読み込み
fileInput.addEventListener('change', async () => {
  const files = Array.from(fileInput.files);
  if (!files.length) return;

  output.replaceChildren();

  trackLayer.clearLayers();

  for (const file of files) {
    const section = document.createElement('div');
    section.className = 'panel';

    const name = document.createElement('strong');
    name.textContent = file.name;
    section.append(name);

    try {
      const xml = new DOMParser().parseFromString(
        await file.text(), 'application/xml'
      );

      if (xml.getElementsByTagName('parsererror').length ||
          xml.documentElement.localName !== 'gpx') {
        throw new Error('GPXファイルを読み取れません。');
      }

      const points = getPoints(xml);
      const area = polygonArea(points);
      const length = pathLength(points);

      drawTrack(points, area);

      const result = document.createElement('div');
      result.dataset.area = area;

      const mode = document.createElement('p');

      if (area > 0) {
        // 面積モード
        mode.textContent = '① 面積モード';
       result.innerHTML = areaText(area); 
      } else {
        // 線モード
        mode.textContent = '② 線モード';

        const distance = document.createElement('p');
        distance.textContent = `軌跡の長さ：${format(length)} m`;

      const label = document.createElement('label');
      label.className = 'input-green';
      label.textContent = '草刈り幅（m）を入力してください';

        const width = document.createElement('input');
        width.type = 'number';
        width.min = '0';
        width.step = 'any';
        width.placeholder = '幅（m）';

        const calculated = document.createElement('p');
        calculated.textContent = '';

        width.addEventListener('input', () => {
          const w = Number(width.value);

          if (width.value.trim() === '' || !Number.isFinite(w) || w < 0) {
            result.dataset.area = 0;
            calculated.textContent = '有効な幅を入力してください。';
          } else {
            const value = length * w;
            result.dataset.area = value;
            calculated.innerHTML = areaText(value); 
          }

          updateTotal();
        });

        result.append(distance, label, width, calculated);
      }

      section.append(mode, result);
    } catch (error) {
      const message = document.createElement('p');
      message.className = 'error';
      message.textContent = error.message;
      section.append(message);
    }

    output.append(section);
  }

  // 読み込んだ軌跡全体を表示
  if (trackLayer.getLayers().length > 0) {
    map.fitBounds(trackLayer.getBounds(), {
      padding: [30, 30],
      maxZoom: 18
    });
  }

  const summary = document.createElement('div');
  summary.className = 'panel';

  const heading = document.createElement('h2');
  heading.textContent = '合計面積';

  const total = document.createElement('div');
  total.id = 'total';
  total.className = 'area';


  const totalUnits = document.createElement('div');
  totalUnits.id = 'totalUnits';
  totalUnits.className = 'other';

  summary.append(heading, total, totalUnits);

  output.append(summary);

  updateTotal();
});
</script>
</body>
</html>
